<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charles .B Studio Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail of apps + content pane over a live canvas "signal field". Single dark look, by choice. */
:root{
  --bg:#07080d; --panel:rgba(16,18,28,.72); --panel-solid:#10121c; --line:rgba(150,160,210,.14);
  --fg:#e9ebf5; --muted:#8f94ad; --accent:#7c8cff;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --rail:260px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 500px at 80% 10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),radial-gradient(700px 500px at 10% 100%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%);transition:background .6s}

/* Sidebar */
.rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail);z-index:5;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:conic-gradient(from 200deg,#7c8cff,#4fd1c5,#f472b6,#fbbf24,#7c8cff);animation:spin 12s linear infinite;flex:none}
.brand b{font-family:var(--display);font-size:15px;letter-spacing:.02em;display:block;line-height:1.2}
.brand small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.nav-label{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 8px;margin:14px 0 4px}
.nav-label em{font-style:normal;letter-spacing:.06em;font-size:9.5px;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
nav a.soon-item{color:var(--muted)}
nav a.soon-item .dot{background:rgba(255,255,255,.04);color:var(--muted);border:1px dashed var(--line)}
.lock-card{margin-top:40px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lock-card div{padding:18px;border-radius:14px;border:1px dashed var(--line);background:var(--panel)}
.lock-card b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin-bottom:6px;font-weight:500}
.lock-card span{font-size:14px;color:var(--muted)}
.price{display:inline-flex;align-items:baseline;gap:6px;margin-top:26px;font-family:var(--display);font-weight:700;font-size:28px;color:var(--fg)}
.price small{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--muted)}
@media (max-width:860px){.lock-card{grid-template-columns:minmax(0,1fr)}}
nav{display:flex;flex-direction:column;gap:4px}
nav a{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:10px;color:var(--fg);text-decoration:none;font-weight:600;font-size:14px;border:1px solid transparent;transition:background .2s,border-color .2s,transform .2s}
nav a:hover{background:rgba(255,255,255,.04);transform:translateX(3px)}
nav a:focus-visible,.btn:focus-visible,.menu-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav a.active{background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);border-color:color-mix(in srgb,var(--c,var(--accent)) 40%,transparent)}
.dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--accent)) 22%,transparent);color:var(--c,var(--accent));flex:none}
.dot svg{width:15px;height:15px}
nav a .ver{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:400}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.discord{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;background:#5865f2;color:#fff;text-decoration:none;font-weight:700;font-size:14px;transition:filter .2s,transform .2s}
.discord:hover{filter:brightness(1.12);transform:translateY(-1px)}
.discord svg{width:20px;height:20px}
.made{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;padding-top:6px}
.made span{background:linear-gradient(90deg,#7c8cff,#4fd1c5,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:500}

/* Main */
main{position:relative;z-index:2;margin-left:var(--rail);min-height:100%;padding-block:56px 40px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}
.page{max-width:900px;animation:rise .55s cubic-bezier(.2,.8,.2,1)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--accent))}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,64px);line-height:1.02;letter-spacing:-.02em;margin:10px 0 16px;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--c,#7c8cff),#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0 0 6px;text-wrap:balance}
.lead{font-size:17px;color:var(--muted);max-width:60ch;margin:0}

.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:40px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:16px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);text-decoration:none;color:var(--fg);overflow:hidden;transition:transform .25s,border-color .25s}
.card::after{content:"";position:absolute;inset:auto -40% -60% auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 35%,transparent),transparent 70%);opacity:.5;transition:opacity .3s}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.card:hover::after{opacity:1}
.card .dot{width:42px;height:42px;border-radius:12px}
.card .dot svg{width:22px;height:22px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .go{font-family:var(--mono);font-size:12px;color:var(--c);margin-top:auto}

/* App page */
.hero-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hero-row .dot{width:64px;height:64px;border-radius:18px}
.hero-row .dot svg{width:32px;height:32px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.02)}
.dl{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;border:0;cursor:pointer;font-family:var(--body);background:var(--c);color:#0a0b10;box-shadow:0 10px 30px -10px var(--c);transition:transform .2s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn svg{width:18px;height:18px}
.btn.pending{background:transparent;color:var(--muted);border:1px dashed var(--line);box-shadow:none;cursor:default}
.btn.pending:hover{transform:none}
.dl-note{font-size:13px;color:var(--muted)}
.features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:36px 0 0;padding:0;list-style:none}
.features li{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14px}
.features li::before{content:"";flex:none;width:7px;height:7px;border-radius:2px;background:var(--c);margin-top:8px}

.steps-head{margin-top:52px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.steps-head span{font-family:var(--mono);font-size:12px;color:var(--muted)}
ol.steps{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;position:relative;padding-bottom:22px}
ol.steps li:not(:last-child)::after{content:"";position:absolute;left:21px;top:44px;bottom:2px;width:2px;background:linear-gradient(var(--c),transparent)}
ol.steps li::before{content:counter(s);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
ol.steps h3{font-size:16px;margin:9px 0 4px}
ol.steps p{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
code,kbd{font-family:var(--mono);font-size:12.5px;background:rgba(255,255,255,.06);border:1px solid var(--line);padding:1px 6px;border-radius:6px;color:var(--fg)}

/* Tool page: content + hanging GIF sign */
.app-layout{max-width:1240px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px 56px;align-items:start}
.col-main{min-width:0}
.col-side{position:sticky;top:28px;min-width:0}
.col-full{grid-column:1/-1;min-width:0}
.sign{position:relative;padding-top:52px;transform-origin:50% 6px;animation:swing 7s ease-in-out infinite}
.hook{position:absolute;top:0;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--panel-solid);border:2px solid color-mix(in srgb,var(--c) 60%,var(--line));box-shadow:0 0 14px -2px var(--c);z-index:1}
.sign::before,.sign::after{content:"";position:absolute;top:7px;left:50%;width:2px;height:64px;margin-left:-1px;transform-origin:50% 0;background:linear-gradient(color-mix(in srgb,var(--c) 70%,transparent),var(--line))}
.sign::before{transform:rotate(48deg)}
.sign::after{transform:rotate(-48deg)}
.board{position:relative;border-radius:18px;padding:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,var(--panel-solid)),var(--panel-solid) 60%);border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));box-shadow:0 30px 60px -24px rgba(0,0,0,.8),0 0 60px -20px var(--c)}
.screw{position:absolute;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c9cde0,#5b6075)}
.screw.tl{top:9px;left:9px}.screw.tr{top:9px;right:9px}.screw.bl{bottom:9px;left:9px}.screw.br{bottom:9px;right:9px}
.plate{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 8px 12px}
.plate .eyebrow{font-size:11px}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg);padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 20%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--c);animation:blink 1.4s ease-in-out infinite}
.win{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0b0d14}
.win-bar{display:flex;align-items:center;gap:8px;height:30px;padding-left:10px;font-size:12px;color:var(--muted);background:#151826;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.win-bar .mini{width:14px;height:14px;border-radius:4px;background:var(--c);flex:none}
.win-bar .t{overflow:hidden;text-overflow:ellipsis}
.win-ctrl{margin-left:auto;display:flex;flex:none}
.win-ctrl span{width:34px;height:30px;display:grid;place-items:center;font-size:13px;color:var(--muted)}
.win-ctrl span:last-child{color:var(--fg)}
.screen{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,color-mix(in srgb,var(--c) 30%,#0b0d14),#0b0d14 70%)}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* animated placeholder: cursor opens Start, clicks the app, window pops up */
.m-bar{position:absolute;left:0;right:0;bottom:0;height:13%;background:rgba(18,20,32,.92);border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;gap:5%}
.m-bar b{width:5.5%;aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.18)}
.m-bar b.start{background:#4aa3ff}
.m-bar b.app{background:var(--c);opacity:0;animation:appIcon 7s infinite}
.m-menu{position:absolute;left:30%;width:40%;top:30%;height:53%;border-radius:6px;background:rgba(28,30,46,.96);border:1px solid rgba(255,255,255,.08);padding:5%;display:grid;grid-template-columns:repeat(3,1fr);gap:7%;align-content:start;opacity:0;transform:translateY(12%);animation:menu 7s infinite}
.m-menu b{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.12)}
.m-menu b.hit{background:var(--c);box-shadow:0 0 10px var(--c)}
.m-win{position:absolute;left:20%;top:12%;width:60%;height:66%;border-radius:6px;background:#141725;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);overflow:hidden;opacity:0;transform:scale(.6);animation:pop 7s infinite}
.m-win::before{content:"";display:block;height:14%;background:var(--c)}
.m-win::after{content:"";position:absolute;left:8%;right:8%;top:28%;bottom:14%;background:repeating-linear-gradient(rgba(255,255,255,.1) 0 8%,transparent 8% 18%)}
.m-cursor{position:absolute;width:5.5%;left:72%;top:28%;animation:cursor 7s infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.soon{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.55);color:var(--fg);border:1px solid var(--line)}
.sign-steps{display:flex;flex-wrap:wrap;gap:6px;padding:12px 4px 0;list-style:none;margin:0}
.sign-steps li{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sign-steps li span{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.sign-steps li:not(:last-child)::after{content:"→";margin-left:2px;opacity:.5}
.sign-cap{margin:10px 4px 0;font-size:13px;color:var(--muted)}
@keyframes swing{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes blink{50%{opacity:.25}}
@keyframes cursor{0%{left:72%;top:28%}18%,24%{left:39%;top:89%}40%,50%{left:49%;top:47%}62%,100%{left:80%;top:70%}}
@keyframes menu{0%,22%{opacity:0;transform:translateY(12%)}27%,50%{opacity:1;transform:none}55%,100%{opacity:0;transform:translateY(6%)}}
@keyframes pop{0%,52%{opacity:0;transform:scale(.6)}60%,92%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes appIcon{0%,55%{opacity:0}60%,92%{opacity:1}100%{opacity:0}}
@media (max-width:1180px){.app-layout{grid-template-columns:minmax(0,1fr)}.col-side{position:static;max-width:460px;width:100%}}

/* Credits */
.credits{margin-top:64px;padding:28px;border-radius:18px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;overflow:hidden}
.credits::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.05) 50%,transparent 70%);background-size:250% 100%;animation:sheen 6s linear infinite;pointer-events:none}
.credits .eyebrow{color:var(--muted)}
.credit-name{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,40px);margin:8px 0 4px;background:linear-gradient(90deg,#7c8cff,#4fd1c5,#f472b6,#fbbf24,#7c8cff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite}
.credit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}
.credit-grid div{font-size:13px;color:var(--muted)}
.credit-grid b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg);margin-bottom:4px;font-weight:500}
footer{margin-top:28px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* Mobile */
.menu-btn{display:none}
@media (max-width:860px){
  .rail{transform:translateX(-102%);transition:transform .3s;width:min(280px,86vw);box-shadow:20px 0 60px rgba(0,0,0,.5)}
  body.open .rail{transform:none}
  main{margin-left:0;padding-top:calc(76px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .menu-btn{display:inline-flex;align-items:center;gap:8px;position:fixed;z-index:6;top:calc(14px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));padding:10px 14px;border-radius:10px;background:var(--panel-solid);border:1px solid var(--line);color:var(--fg);font-family:var(--body);font-weight:700;font-size:14px;cursor:pointer}
  .apps,.features,.credit-grid{grid-template-columns:minmax(0,1fr)}
}
/* NEW RELEASE tag */
nav .nm{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;line-height:1.2}
.new-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.14em;padding:3px 8px;border-radius:999px;color:#0a0b10;background:linear-gradient(100deg,var(--c,var(--accent)) 35%,#ffffff 50%,var(--c,var(--accent)) 65%);background-size:250% 100%;animation:shine 2.6s linear infinite;box-shadow:0 0 14px -3px var(--c,var(--accent));white-space:nowrap}
.new-tag i{width:5px;height:5px;border-radius:50%;background:#0a0b10;animation:blink 1.2s ease-in-out infinite}
.h1-row{display:flex;align-items:center;flex-wrap:wrap;gap:12px 18px;margin:10px 0 16px}
.h1-row h1{margin:0}
.new-tag.big{font-size:12px;padding:7px 15px;gap:8px;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent),0 0 30px -4px var(--c)}
.new-tag.big i{width:7px;height:7px}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes blink{50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
@keyframes sheen{from{background-position:150% 0}to{background-position:-100% 0}}
@keyframes flow{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="glow" id="glow" aria-hidden="true"></div>

<button class="menu-btn" id="menuBtn" aria-label="Open menu">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu
</button>

<aside class="rail" id="rail">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"></div>
    <div><b>Studio Hub</b><small>Windows apps · free</small></div>
  </div>
  <nav id="nav"></nav>
  <div class="rail-foot">
    <a class="discord" id="discordLink" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.3 4.4A19.7 19.7 0 0 0 15.4 3l-.6 1.3a18.3 18.3 0 0 0-5.6 0L8.6 3a19.6 19.6 0 0 0-4.9 1.5C.6 9.1-.3 13.7.2 18.2a19.8 19.8 0 0 0 6 3l1.3-2a12.8 12.8 0 0 1-2-1l.5-.4a14.1 14.1 0 0 0 12 0l.5.4c-.6.4-1.3.7-2 1l1.3 2a19.7 19.7 0 0 0 6-3c.5-5.2-.9-9.8-3.5-13.8ZM8.5 15.4c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm7 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>

/* Animated background: drifting nodes linked by lines, tinted per app */
const field = (() => {
  const c = document.getElementById("bg"), ctx = c.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, dpr, pts = [];
  const state = { tint:"#7c8cff" };
  function resize(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
    const n = Math.round(Math.min(90, innerWidth * innerHeight / 16000));
    pts = Array.from({length:n}, () => ({x:Math.random()*w, y:Math.random()*h, vx:(Math.random()-.5)*.25*dpr, vy:(Math.random()-.5)*.25*dpr, r:(Math.random()*1.6+.6)*dpr}));
  }
  function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
  let t = 0;
  function frame(){
    t += .004;
    ctx.clearRect(0,0,w,h);
    // slow aurora bands
    for (let i=0;i<3;i++){
      const y = h*(.3+.25*i) + Math.sin(t*1.3+i*2)*h*.08;
      const g = ctx.createLinearGradient(0,y-h*.18,0,y+h*.18);
      g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(.5,hexA(state.tint,.045)); g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.fillRect(0,y-h*.18,w,h*.36);
    }
    const max = 140*dpr;
    for (const p of pts){
      p.x += p.vx; p.y += p.vy;
      if (p.x<0||p.x>w) p.vx*=-1; if (p.y<0||p.y>h) p.vy*=-1;
    }
    for (let i=0;i<pts.length;i++){
      const a = pts[i];
      for (let j=i+1;j<pts.length;j++){
        const b = pts[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy);
        if (d<max){ ctx.strokeStyle = hexA(state.tint, (1-d/max)*.22); ctx.lineWidth = dpr*.8; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      }
      ctx.fillStyle = hexA(state.tint,.7); ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,Math.PI*2); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  addEventListener("resize", () => { resize(); if (reduce) frame(); });
  resize(); frame();
  return { set tint(v){ state.tint = v; if (reduce) frame(); } };
})();
